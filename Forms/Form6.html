<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Championship Registration Form</title>

    <link rel="stylesheet" href="Form6.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <div class="mainContainer">

        <header class="heading">
            School Championship Registration Form
        </header>

        <form>

            <div class="inputGroup">
                <label for="schoolName">
                    School name:<span>*</span>
                </label>

                <input type="text" id="schoolName" name="schoolName" required>
            </div>

            <div class="inputGroup">
                <label>
                    Schooler name:<span>*</span>
                </label>

                <div class="nameGroup">
                    <input type="text" name="studentFirstName" placeholder="First" aria-label="Student first name" required>
                    <input type="text" name="studentLastName" placeholder="Last" aria-label="Student last name" required>
                </div>
            </div>

            <div class="inputGroup">
                <label>
                    Parent name:<span>*</span>
                </label>

                <div class="nameGroup">
                    <input type="text" name="parentFirstName" placeholder="First" aria-label="Parent first name" required>
                    <input type="text" name="parentLastName" placeholder="Last" aria-label="Parent last name" required>
                </div>
            </div>

            <div class="inputGroup">
                <label for="parentPhone">
                    Parent phone:<span>*</span>
                </label>

                <input
                    type="tel"
                    id="parentPhone"
                    name="parentPhone"
                    placeholder="### ### ####"
                    required
                >
            </div>

            <div class="inputGroup">
                <label for="parentEmail">
                    Parent email:<span>*</span>
                </label>

                <input
                    type="email"
                    id="parentEmail"
                    name="parentEmail"
                    required
                >
            </div>

            <div class="inputGroup">
                <label for="sport">
                    Preferred sport:<span>*</span>
                </label>

                <input
                    type="text"
                    id="sport"
                    name="sport"
                    required
                >
            </div>

            <div class="verificationDiv">

                <label>
                    Verification<span>*</span>
                </label>

                <div class="captchaBox">
                    <input type="checkbox" id="robot">
                    <label for="robot">I'm not a robot</label>

                    <div class="captchaLogo">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        <small>reCAPTCHA</small>
                    </div>
                </div>

            </div>

            <div class="submitDiv">
                <button type="submit">
                    <i class="fa-solid fa-paper-plane"></i>
                    Submit
                </button>
            </div>

        </form>

    </div>

</body>
</html>
