<!DOCTYPE html>
<html>
    <head>
        <title>

        </title>

        <link rel="stylesheet" href="Form1.css">
    </head>

    <body>
        <div class="mainContainer">
            <h1 class="header">
                Register
            </h1><br /><br />

            <p>
                Kindly Fill in this Form to Register
            </p><br />

            <form class="mainForm">
                <label for="userName">
                    Username
                </label><br/>
                <input type="text" id="nameInput" placeholder="Enter Username">

                <label for="email"><br />
                    E-Mail
                </label><br/>
                <input type="email" id="emailInput" placeholder="Enter E-Mail">

                <label for="password"><br />
                    Password
                </label><br/>
                <input type="password" id="passwordInput" placeholder="Enter Password">

                <label for="password"><br />
                    Repeat Password
                </label><br/>
                <input type="password" id="passwordInput" placeholder="Enter Password">

                <br/><br />

                <button type="submit">
                    Register
                </button>

                <br /><br />
                <span>
                    Already have an Account?
                    <a href="#">
                        Log In
                    </a>
                </span>

                
            </form>
        </div>
    </body>
</html>
