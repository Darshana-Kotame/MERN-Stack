<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" >
        <title>
            BookMyShow NavBar
        </title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" 
              integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" 
              crossorigin="anonymous" referrerpolicy="no-referrer">

        <link rel="stylesheet" href="BookMyShow.css">
    </head>

    <body>
        <nav class="topNav">
            <div class="leftNav">
                <img src="./assets/BookMyShow.jpg" alt="" class="logo">

                <div class="searchBox">
                <i class="fa-sharp fa-solid fa-magnifying-glass"></i>

                <span class="searchName">
                    Search
                </span>
            </div>
            </div>

            <div class="rightNav">
                <span class="pune">
                    Pune
                    <i class="fa-solid fa-caret-down"></i>
                </span>

                <span class="signIn">
                    Sign In
                </span>

                <span class="dots">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </span>
            </div>
        </nav>

        <nav class="bottomNav">
            <div class="leftNav1">
                <span>
                    Movies
                </span>

                <span>
                    Streams
                </span>

                <span>
                    Events
                </span>

                <span>
                    Plays
                </span>

                <span>
                    Sports
                </span>

                <span>
                    Activities
                </span>
            </div>

            <div class="rightNav1">
                <span>
                    ListYourShows
                </span>

                <span>
                    Corporate
                </span>

                <span>
                    Offers
                </span>

                <span>
                    Gift Cards
                </span>
            </div>
        </nav>
    </body>
</html>
