<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Assignment</title>

    <style>
        .Row1{
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(3,100px);
            grid-template-rows: repeat(3,100px);

        }

        .Row1 div{
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }


    </style>

</head>
<body>
    <div class="Row1">
        <div class="box1" style="background-color: red;">

        </div>
        <div class="box2" style="background-color: purple;">
            
        </div>
        <div class="box3" style="background-color: pink;">
            
        </div>
   
        <div class="box4" style="background-color: violet;">

        </div>
        <div class="box5" style="background-color: blue;">
            
        </div>
        <div class="box6" style="background-color: brown;">
            
        </div>
   
        <div class="box7" style="background-color: green;">

        </div>
        <div class="box8" style="background-color: yellow;">
            
        </div>
        <div class="box9" style="background-color: grey;">
            
        </div>
    </div>
</body>
</html>
