<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Assignment</title>

    <style>
        .mainContainer{
            height: 500px;
            width: 500px;
            border: 4px solid black;
            justify-content: center;
            align-items: center;
            margin: 30px;
            display: grid;
            gap: 5px;
        }

        .Header,.footer{
            width: 450px;
            height: 20px;
            border: 2px solid greenyellow;
            text-align: center;
            padding: 10px;
        }

        .navBar{
             width: 450px;
            height: 20px;
            border: 2px solid greenyellow;
            text-align: center;
            padding: 10px;
        }

        .container{
            display: grid;
            width: 450px;
            height: 270px;
            text-align: center;
            padding: 10px;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 5px;
            vertical-align: middle;
            
        }

        .content1,.content2{
            border: 2px solid greenyellow;
            padding-top: 100px;
        }

        .mainCotent{
             border: 2px solid greenyellow;
             padding-top: 100px;
        }

        
    </style>

</head>
<body>
    <div class="mainContainer">
        <div class="Header">
            <header>
                HEADER
            </header>
        </div>

        <nav class="navBar">
            NAVBAR
        </nav>

        <div class="container">
            <div class="content1">
                CONTENT
            </div>

            <div class="mainCotent">
                MAIN CONTENT
            </div>

            <div class="content2">
                CONTENT
            </div>
        </div>

        <footer class="footer">
            FOOTER
        </footer>
    </div>
</body>
</html>
