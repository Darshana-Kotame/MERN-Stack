<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Assignment</title>

    <style>
        .animeContainer{
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(3,150px);
            grid-template-rows: repeat(3,150px);
            justify-content: center;
            overflow: visible;
           
            
        }

        .animeContainer img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: darkcyan;
           position: relative;
           z-index: 1;
           transition: transform 0.3s ease;
        }

        .animeContainer img:hover{
           transform: scale(1.5);
           z-index: 999; 
           cursor: pointer;
           
        }
    </style>

</head>
<body>
    <div class="animeContainer">
        <div class="anime1">
            <img src="./assets/anime1.jpg" alt="">
        </div>

        <div class="anime2">
            <img src="./assets/anime2.jpg" alt="">
        </div>

        <div class="anime3">
            <img src="./assets/anime3.jpg" alt="">
        </div>

        <div class="anime4">
            <img src="./assets/anime4.jpg" alt="">
        </div>

        <div class="anime5">
            <img src="./assets/anime5.jpg" alt="">
        </div>

        <div class="anime6">
            <img src="./assets/anime6.jpg" alt="">
        </div>

        <div class="anime7">
            <img src="./assets/anime7.jpg" alt="">
        </div>

        <div class="anime8">
            <img src="./assets/anime8.jpg" alt="">
        </div>

        <div class="anime9">
            <img src="./assets/anime9.jpg" alt="">
        </div>

        
    </div>
</body>
</html>
